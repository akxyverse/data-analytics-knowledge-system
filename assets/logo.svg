<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Data Analytics Knowledge Hub logo">
  <defs>
    <linearGradient id="logoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1122"/>
      <stop offset="100%" stop-color="#0f4c4a"/>
    </linearGradient>
    <linearGradient id="logoBars" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#5eead4"/>
    </linearGradient>
    <linearGradient id="logoTrend" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>

  <rect width="240" height="240" rx="48" fill="url(#logoBg)"/>

  <!-- ascending bar cluster -->
  <g>
    <rect x="58"  y="128" width="20" height="52" rx="4" fill="url(#logoBars)" opacity="0.85"/>
    <rect x="88"  y="104" width="20" height="76" rx="4" fill="url(#logoBars)" opacity="0.9"/>
    <rect x="118" y="86"  width="20" height="94" rx="4" fill="url(#logoBars)"/>
    <rect x="148" y="64"  width="20" height="116" rx="4" fill="url(#logoBars)"/>
  </g>

  <!-- upward trend line with arrowhead, cutting across the bars -->
  <polyline points="52,150 96,112 130,124 176,58" fill="none" stroke="url(#logoTrend)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <polygon points="176,58 158,64 172,78" fill="#22d3ee"/>

  <!-- data node -->
  <circle cx="176" cy="58" r="9" fill="#0a1122" stroke="#38bdf8" stroke-width="3"/>
  <circle cx="176" cy="58" r="3" fill="#5eead4"/>
</svg>
