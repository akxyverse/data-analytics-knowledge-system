<svg width="1200" height="320" viewBox="0 0 1200 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Data Analytics Knowledge Hub banner">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1122"/>
      <stop offset="45%" stop-color="#0b2545"/>
      <stop offset="100%" stop-color="#0f4c4a"/>
    </linearGradient>
    <radialGradient id="glow" cx="82%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#5eead4"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#glow)"/>

  <!-- network / node motif, top right -->
  <g stroke="#38bdf8" stroke-width="1" opacity="0.35">
    <line x1="880" y1="50" x2="960" y2="30"/>
    <line x1="960" y1="30" x2="1040" y2="70"/>
    <line x1="960" y1="30" x2="1000" y2="110"/>
    <line x1="1040" y1="70" x2="1110" y2="45"/>
    <line x1="1000" y1="110" x2="1080" y2="130"/>
  </g>
  <g fill="#22d3ee" opacity="0.6">
    <circle cx="880" cy="50" r="4"/>
    <circle cx="960" cy="30" r="5"/>
    <circle cx="1040" cy="70" r="4"/>
    <circle cx="1000" cy="110" r="4"/>
    <circle cx="1110" cy="45" r="3.5"/>
    <circle cx="1080" cy="130" r="3.5"/>
  </g>

  <!-- dot grid texture -->
  <g fill="#38bdf8" opacity="0.10">
    <circle cx="60" cy="40" r="2.2"/><circle cx="100" cy="40" r="2.2"/><circle cx="140" cy="40" r="2.2"/>
    <circle cx="60" cy="70" r="2.2"/><circle cx="100" cy="70" r="2.2"/><circle cx="140" cy="70" r="2.2"/>
  </g>

  <!-- faint code glyph -->
  <text x="1030" y="270" font-family="Consolas, Menlo, monospace" font-size="64" fill="#38bdf8" opacity="0.10">&lt;/&gt;</text>

  <!-- trend line with markers -->
  <polyline points="70,240 160,215 250,230 340,180 430,195 520,150 610,165"
    fill="none" stroke="#5eead4" stroke-width="2.5" opacity="0.55"/>
  <g fill="#5eead4" opacity="0.75">
    <circle cx="70" cy="240" r="3"/><circle cx="160" cy="215" r="3"/><circle cx="250" cy="230" r="3"/>
    <circle cx="340" cy="180" r="3"/><circle cx="430" cy="195" r="3"/><circle cx="520" cy="150" r="3"/><circle cx="610" cy="165" r="3.5"/>
  </g>

  <!-- mini bar chart -->
  <g transform="translate(70,150)">
    <rect x="0"  y="45" width="13" height="45" rx="2" fill="url(#barGrad)"/>
    <rect x="19" y="25" width="13" height="65" rx="2" fill="url(#barGrad)"/>
    <rect x="38" y="55" width="13" height="35" rx="2" fill="url(#barGrad)"/>
    <rect x="57" y="10" width="13" height="80" rx="2" fill="url(#barGrad)"/>
  </g>

  <text x="150" y="150" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="46" font-weight="700" fill="#f8fafc">
    DATA ANALYTICS KNOWLEDGE HUB
  </text>
  <rect x="150" y="164" width="150" height="4" rx="2" fill="url(#accent)"/>
  <text x="150" y="200" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="500" fill="#a7f3ec">
    Fundamentals &#8226; Python &#8226; SQL &#8226; BI Tools &#8226; Analytics Concepts
  </text>
  <text x="150" y="232" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#7dd3c8">
    The core learning track of the Akxyverse Data Analytics ecosystem
  </text>

  <text x="1130" y="295" text-anchor="end" font-family="Consolas, Menlo, monospace" font-size="14" fill="#5b7a8e">
    github.com/akxyverse
  </text>
</svg>
