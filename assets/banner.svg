<svg width="1200" height="320" viewBox="0 0 1200 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Data Analytics Knowledge Hub banner">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1122"/>
      <stop offset="45%" stop-color="#0b2545"/>
      <stop offset="100%" stop-color="#0f4c4a"/>
    </linearGradient>
    <radialGradient id="glow" cx="82%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="pageGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5eead4"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#glow)"/>

  <g fill="#38bdf8" opacity="0.08">
    <circle cx="60" cy="40" r="2.2"/><circle cx="100" cy="40" r="2.2"/><circle cx="140" cy="40" r="2.2"/>
    <circle cx="60" cy="70" r="2.2"/><circle cx="100" cy="70" r="2.2"/><circle cx="140" cy="70" r="2.2"/>
  </g>

  <!-- open book, right side, transitioning into a data grid -->
  <g transform="translate(870,110)">
    <!-- left page -->
    <path d="M0,10 Q60,-15 120,10 L120,140 Q60,115 0,140 Z" fill="#0d3b52" stroke="#38bdf8" stroke-width="1.5" opacity="0.9"/>
    <line x1="16" y1="35" x2="100" y2="22" stroke="#38bdf8" stroke-width="2" opacity="0.5"/>
    <line x1="16" y1="60" x2="100" y2="50" stroke="#38bdf8" stroke-width="2" opacity="0.5"/>
    <line x1="16" y1="85" x2="100" y2="78" stroke="#38bdf8" stroke-width="2" opacity="0.5"/>
    <!-- right page dissolving into bars/grid -->
    <path d="M120,10 Q180,-15 240,10 L240,140 Q180,115 120,140 Z" fill="#0d3b52" stroke="#22d3ee" stroke-width="1.5" opacity="0.9"/>
    <rect x="140" y="95" width="10" height="35" rx="2" fill="url(#pageGrad)"/>
    <rect x="156" y="75" width="10" height="55" rx="2" fill="url(#pageGrad)"/>
    <rect x="172" y="55" width="10" height="75" rx="2" fill="url(#pageGrad)"/>
    <rect x="188" y="35" width="10" height="95" rx="2" fill="url(#pageGrad)"/>
    <!-- spine highlight -->
    <line x1="120" y1="10" x2="120" y2="140" stroke="#f8fafc" stroke-width="2" opacity="0.6"/>
  </g>

  <!-- floating data nodes around the book -->
  <g fill="#5eead4" opacity="0.6">
    <circle cx="1080" cy="70" r="4"/><circle cx="1130" cy="110" r="3.5"/><circle cx="1100" cy="180" r="4"/>
  </g>
  <g stroke="#38bdf8" stroke-width="1" opacity="0.3">
    <line x1="990" y1="75" x2="1080" y2="70"/>
    <line x1="990" y1="75" x2="1100" y2="180"/>
  </g>

  <text x="150" y="150" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="46" font-weight="700" fill="#f8fafc">
    DATA ANALYTICS KNOWLEDGE HUB
  </text>
  <rect x="150" y="164" width="150" height="4" rx="2" fill="url(#accent)"/>
  <text x="150" y="200" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="500" fill="#a7f3ec">
    Fundamentals &#8226; Python &#8226; SQL &#8226; BI Tools &#8226; Analytics Concepts
  </text>
  <text x="150" y="232" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#7dd3c8">
    Where learning becomes structured knowledge
  </text>

  <text x="1130" y="295" text-anchor="end" font-family="Consolas, Menlo, monospace" font-size="14" fill="#5b7a8e">
    github.com/akxyverse
  </text>
</svg>
