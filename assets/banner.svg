<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Data Analytics Knowledge Management System banner">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="55%" stop-color="#0b2545"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>

  <!-- decorative dot grid -->
  <g fill="#38bdf8" opacity="0.12">
    <circle cx="60" cy="40" r="2.5"/><circle cx="100" cy="40" r="2.5"/><circle cx="140" cy="40" r="2.5"/>
    <circle cx="60" cy="70" r="2.5"/><circle cx="100" cy="70" r="2.5"/><circle cx="140" cy="70" r="2.5"/>
    <circle cx="1060" cy="240" r="2.5"/><circle cx="1100" cy="240" r="2.5"/><circle cx="1140" cy="240" r="2.5"/>
    <circle cx="1060" cy="270" r="2.5"/><circle cx="1100" cy="270" r="2.5"/><circle cx="1140" cy="270" r="2.5"/>
  </g>

  <!-- simple bar-chart glyph -->
  <g transform="translate(70,150)" opacity="0.9">
    <rect x="0"  y="30" width="14" height="60" rx="2" fill="#38bdf8"/>
    <rect x="20" y="10" width="14" height="80" rx="2" fill="#22d3ee"/>
    <rect x="40" y="45" width="14" height="45" rx="2" fill="#5eead4"/>
    <rect x="60" y="0"  width="14" height="90" rx="2" fill="#38bdf8"/>
  </g>

  <text x="150" y="140" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="46" font-weight="700" fill="#f8fafc">
    DATA ANALYTICS
  </text>
  <text x="150" y="182" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="600" letter-spacing="4" fill="url(#accent)">
    KNOWLEDGE MANAGEMENT SYSTEM
  </text>
  <text x="150" y="216" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#94a3b8">
    Learning Roadmap &#8226; Technologies &#8226; Projects &#8226; Resources &#8226; Career
  </text>

  <text x="1130" y="270" text-anchor="end" font-family="Consolas, Menlo, monospace" font-size="14" fill="#64748b">
    github.com/akxyverse
  </text>
</svg>
